<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Community Discussion - TooU</title>
  <link rel="stylesheet" href="assets/css/shared.css">
  <link rel="stylesheet" href="assets/css/community-discussion.css">
</head>
<body data-page="community-discussion">
  <div class="container">
    <div id="site-header"></div>

    <main class="discussion-shell">
      <a href="community.html" class="page-back-link"><i class="fa-solid fa-arrow-left"></i>Back to Community</a>
      <section class="discussion-hero" id="discussionHero"></section>
      <section class="discussion-comments">
        <div class="discussion-comments-head">
          <h2>Discussion Replies</h2>
          <p>Edit or remove your own replies anytime.</p>
        </div>
        <form class="discussion-compose" id="discussionCompose"></form>
        <div class="discussion-thread" id="discussionThread"></div>
      </section>
    </main>
  </div>

  <div id="site-nav"></div>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/community-discussion.js"></script>
</body>
</html>
